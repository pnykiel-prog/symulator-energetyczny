[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "koferymentacja"
version = "0.1.0"
description = "Moduł koferymentacyjny symulatora energetycznego (Odpady -> Energia)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.24",
    "numpy-financial>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["koferymentacja", "koferymentacja.core", "koferymentacja.io_layer"]

[tool.setuptools.package-data]
koferymentacja = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
