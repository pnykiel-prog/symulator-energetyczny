[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "koferymentacja"
version = "0.1.0"
description = "Moduł koferymentacyjny symulatora energetycznego (Odpady -> Energia)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.24",
    "numpy-financial>=1.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
dev = ["pytest>=7.0", "httpx>=0.27"]

[tool.setuptools]
packages = [
    "koferymentacja",
    "koferymentacja.core",
    "koferymentacja.io_layer",
    "koferymentacja.web",
]

[tool.setuptools.package-data]
koferymentacja = ["data/*.json", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
